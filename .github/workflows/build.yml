name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jplayrecords

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test the server (demo collection)
        run: |
          DATA_DIR=$RUNNER_TEMP/data npm run demo-data
          PORT=8090 DATA_DIR=$RUNNER_TEMP/data DEV_ADMIN=1 npm start &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8090/ | grep -q '<div id="app">'
          curl -fs 'http://127.0.0.1:8090/api/records?q=blue' | grep -q '"total"'
          curl -fs http://127.0.0.1:8090/api/admin | grep -q '"grids"'

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
